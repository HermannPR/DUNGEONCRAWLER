<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dungeon Crawler</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Courier New', monospace;
      background-color: #1a1a1a;
      color: #fff;
      overflow: hidden;
      touch-action: none; /* Prevent default touch behaviors */
    }

    #game-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    #canvas-container {
      flex: 1;
      position: relative;
      background-color: #000;
    }

    #ui-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      pointer-events: none;
      z-index: 10;
    }

    #hud {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(0, 0, 0, 0.8);
      padding: 15px;
      border: 2px solid #4a4a4a;
      border-radius: 5px;
      min-width: 250px;
    }

    #hud h2 {
      font-size: 18px;
      margin-bottom: 10px;
      color: #ffd700;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      margin: 5px 0;
      font-size: 14px;
    }

    .stat-label {
      color: #aaa;
    }

    .stat-value {
      color: #fff;
      font-weight: bold;
    }

    .health-bar {
      width: 100%;
      height: 20px;
      background: #333;
      border: 1px solid #666;
      border-radius: 3px;
      overflow: hidden;
      margin-top: 5px;
    }

    .health-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #ff0000, #ff4444);
      transition: width 0.3s ease;
    }

    #combat-log {
      position: absolute;
      bottom: 20px;
      left: 20px;
      right: 20px;
      max-width: 600px;
      background: rgba(0, 0, 0, 0.9);
      padding: 10px;
      border: 2px solid #4a4a4a;
      border-radius: 5px;
      max-height: 150px;
      overflow-y: auto;
    }

    .log-entry {
      font-size: 12px;
      padding: 2px 0;
      opacity: 0;
      animation: fadeIn 0.3s forwards;
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    .log-damage {
      color: #ff4444;
    }

    .log-heal {
      color: #44ff44;
    }

    .log-info {
      color: #aaaaaa;
    }

    .log-loot {
      color: #ffd700;
    }

    #mobile-controls {
      position: absolute;
      bottom: 180px;
      right: 20px;
      display: none;
      grid-template-columns: repeat(3, 60px);
      grid-template-rows: repeat(3, 60px);
      gap: 5px;
    }

    @media (max-width: 768px) {
      #mobile-controls {
        display: grid;
      }
    }

    .control-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 5px;
      color: white;
      font-size: 24px;
      cursor: pointer;
      pointer-events: all;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    .control-btn:active {
      background: rgba(255, 255, 255, 0.3);
    }

    .control-btn:nth-child(2) {
      grid-column: 2;
      grid-row: 1;
    }

    .control-btn:nth-child(3) {
      grid-column: 1;
      grid-row: 2;
    }

    .control-btn:nth-child(4) {
      grid-column: 3;
      grid-row: 2;
    }

    .control-btn:nth-child(5) {
      grid-column: 2;
      grid-row: 3;
    }

    #loading {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      z-index: 1000;
    }

    #loading.hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div id="loading">Loading Dungeon Crawler...</div>

  <div id="game-container">
    <div id="canvas-container"></div>

    <div id="ui-overlay">
      <!-- Player HUD -->
      <div id="hud">
        <h2>⚔️ Player Stats</h2>
        <div class="stat-row">
          <span class="stat-label">Level:</span>
          <span class="stat-value" id="player-level">1</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">HP:</span>
          <span class="stat-value" id="player-hp">100/100</span>
        </div>
        <div class="health-bar">
          <div class="health-bar-fill" id="player-hp-bar" style="width: 100%"></div>
        </div>
        <div class="stat-row">
          <span class="stat-label">Attack:</span>
          <span class="stat-value" id="player-attack">10</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">Defense:</span>
          <span class="stat-value" id="player-defense">5</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">Floor:</span>
          <span class="stat-value" id="dungeon-floor">1</span>
        </div>
      </div>

      <!-- Combat Log -->
      <div id="combat-log">
        <div class="log-entry log-info">Welcome to the Dungeon! Use arrow keys or WASD to move.</div>
        <div class="log-entry log-info">Collect potions and defeat enemies to progress!</div>
      </div>

      <!-- Mobile Controls -->
      <div id="mobile-controls">
        <button class="control-btn" data-direction="up">▲</button>
        <button class="control-btn" data-direction="left">◄</button>
        <button class="control-btn" data-direction="right">►</button>
        <button class="control-btn" data-direction="down">▼</button>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
